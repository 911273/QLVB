name: Deploy Firebase App

# Tự động build & deploy app trong firebase-app/ lên Firebase (Hosting + Firestore).
# Kích hoạt khi push vào nhánh làm việc, hoặc chạy tay từ tab Actions.
on:
  push:
    branches:
      - claude/google-firebase-setup-z0g3j3
    paths:
      - 'firebase-app/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Config web của Firebase KHÔNG phải bí mật (đi kèm client),
        # nên để trực tiếp ở đây cho tiện build.
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDRBhVlVu6Ce6-CJommhAafZqt775fzeOA
          VITE_FIREBASE_AUTH_DOMAIN: vupq-hub.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: vupq-hub
          VITE_FIREBASE_STORAGE_BUCKET: vupq-hub.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '560640156221'
          VITE_FIREBASE_APP_ID: '1:560640156221:web:d328b2513df38e0c180054'
          VITE_FIREBASE_MEASUREMENT_ID: G-9E3S6LDV2F
        run: npm run build

      - name: Deploy to Firebase (Hosting + Firestore)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore --project vupq-hub
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VUPQ_HUB }}
          PROJECT_ID: vupq-hub
