<script>
/* ============ Xác thực + gọi server qua apiDispatch ============ */
var TOKEN = '';
try { TOKEN = localStorage.getItem('qlvb_token') || ''; } catch (e) {}

// Mọi lời gọi server đều đi qua apiDispatch(token, method, payload).
function call(method, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (err) {
        // Token hỏng/hết hạn -> quay lại màn hình đăng nhập.
        if (err && /^AUTH:/.test(err.message || '')) { doLogout(true); }
        reject(err);
      })
      .apiDispatch(TOKEN, method, payload || {});
  });
}

var TYPE_ICONS = {}; // code -> short label
var STATE = { status: null, docTypes: [], issuers: [], issuerLevels: [], me: null };

/* ============ Tiện ích UI ============ */
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function esc(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function showLoading(show, text) {
  var l = $('#loading');
  $('#loadingText').textContent = text || 'Đang xử lý...';
  l.classList.toggle('hidden', !show);
}
var toastTimer;
function toast(msg, type) {
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 3200);
}
function fmtDate(iso) {
  if (!iso) return '—';
  var p = String(iso).split('-');
  if (p.length === 3) return p[2] + '/' + p[1] + '/' + p[0];
  return iso;
}
function fmtDateTime(iso) {
  if (!iso) return 'Chưa quét';
  try { return new Date(iso).toLocaleString('vi-VN'); } catch (e) { return iso; }
}
// 'yyyy-MM-dd' -> 'dd/mm/yyyy' (cho ô nhập)
function isoToDmy(iso) {
  if (!iso) return '';
  var p = String(iso).substring(0, 10).split('-');
  if (p.length === 3) return p[2] + '/' + p[1] + '/' + p[0];
  return '';
}
// 'dd/mm/yyyy' (hoặc d/m/yyyy) -> 'yyyy-MM-dd'; chấp nhận rỗng.
function dmyToIso(s) {
  s = (s || '').trim();
  if (!s) return '';
  var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) {
    var pad = function (x) { x = parseInt(x, 10); return x < 10 ? '0' + x : '' + x; };
    return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
  }
  // đã là yyyy-mm-dd thì giữ nguyên
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) return s;
  return '';
}
// Gõ số tự chèn dấu "/" -> dd/mm/yyyy
function autoSlashDate_(input) {
  var d = input.value.replace(/\D/g, '').substring(0, 8);
  var out = d;
  if (d.length >= 5) out = d.substring(0, 2) + '/' + d.substring(2, 4) + '/' + d.substring(4);
  else if (d.length >= 3) out = d.substring(0, 2) + '/' + d.substring(2);
  input.value = out;
}
// Kích hoạt các ô ngày (.date-field): gõ tự thêm "/" + nút 📅 mở lịch gốc.
function initDateFields(root) {
  var fields = (root || document).querySelectorAll('.date-field');
  Array.prototype.forEach.call(fields, function (f) {
    if (f.__wired) return; f.__wired = true;
    var text = f.querySelector('.date-text');
    var native = f.querySelector('.date-native');
    if (!text) return;
    text.addEventListener('input', function () { autoSlashDate_(text); });
    if (native) {
      // Mở lịch tại đúng ngày đang nhập (nếu có).
      native.addEventListener('focus', function () { var iso = dmyToIso(text.value); if (iso) native.value = iso; });
      native.addEventListener('click', function () { var iso = dmyToIso(text.value); if (iso) native.value = iso; });
      native.addEventListener('change', function () {
        if (native.value) {
          text.value = isoToDmy(native.value);
          text.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
    }
  });
}

/* ============ Khởi động ============ */
document.addEventListener('DOMContentLoaded', function () {
  bindTabs();
  bindActions();
  bindLogin();
  initDateFields(document);
  if (TOKEN) { loadStatus(); }
  else { showLogin(); }
});

/* ============ Đăng nhập / đăng xuất ============ */
function showLogin() {
  $('#loginScreen').classList.remove('hidden');
  $('#app').classList.add('hidden');
}
function showApp() {
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
}
function bindLogin() {
  $('#btnLogin').addEventListener('click', doLogin);
  $('#loginPassword').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('#loginEmail').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
}
function doLogin() {
  var email = $('#loginEmail').value.trim();
  var pw = $('#loginPassword').value;
  if (!email || !pw) { $('#loginError').textContent = 'Nhập email và mật khẩu.'; return; }
  $('#loginError').textContent = '';
  showLoading(true, 'Đang đăng nhập...');
  call('login', { email: email, password: pw }).then(function (r) {
    TOKEN = r.token;
    try { localStorage.setItem('qlvb_token', TOKEN); } catch (e) {}
    STATE.me = r.account;
    $('#loginPassword').value = '';
    showLoading(false);
    showApp();
    STATE.searched = false;
    loadStatus();
  }).catch(function (err) {
    showLoading(false);
    $('#loginError').textContent = (err && err.message) || 'Đăng nhập thất bại.';
  });
}
function doLogout(silent) {
  TOKEN = '';
  try { localStorage.removeItem('qlvb_token'); } catch (e) {}
  STATE.me = null; STATE.status = null; STATE.searched = false;
  showLogin();
  if (!silent) toast('Đã đăng xuất.', 'ok');
}

function bindTabs() {
  $all('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      $all('.tab').forEach(function (t) { t.classList.remove('active'); });
      $all('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      $('#tab-' + tab.dataset.tab).classList.add('active');
      if (tab.dataset.tab === 'list') loadList(1);
      if (tab.dataset.tab === 'overview') loadStats();
      if (tab.dataset.tab === 'settings') { renderTypesTable(); renderIssuersTable(); renderVisionStatus(); renderAccounts(); renderTrashBadge(); }
      if (tab.dataset.tab === 'scan') { loadUploadHint(); renderOcrQueue(); renderDupStatus(); }
    });
  });
}

function bindActions() {
  $('#btnInit').addEventListener('click', doInitialize);
  $('#btnSearch').addEventListener('click', function () { doSearch(1); });
  $('#btnSearchClear').addEventListener('click', clearSearch);
  $('#btnExport').addEventListener('click', doExport);
  var bcm = $('#btnSearchClearM'); if (bcm) bcm.addEventListener('click', clearSearch);
  var bem = $('#btnExportM'); if (bem) bem.addEventListener('click', doExport);
  var btf = $('#btnToggleFilters');
  if (btf) btf.addEventListener('click', function () {
    var adv = $('#advFilters');
    var collapsed = adv.classList.toggle('collapsed');
    btf.textContent = collapsed ? 'Bộ lọc ▾' : 'Bộ lọc ▴';
  });
  // Trên điện thoại: thu gọn bộ lọc nâng cao để ưu tiên ô tìm kiếm + kết quả.
  if (window.innerWidth <= 720) {
    var adv0 = $('#advFilters'); if (adv0) adv0.classList.add('collapsed');
  }
  $('#sKeyword').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(1); });
  $('#sIssuer').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(1); });
  $('#sNumber').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(1); });
  $('#sFrom').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(1); });
  $('#sTo').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(1); });
  // Đổi bộ lọc là tự tìm lại ngay.
  ['sType', 'sLevel', 'sStatus', 'sSecurity', 'sSort', 'sFrom', 'sTo'].forEach(function (id) {
    var elx = document.getElementById(id);
    if (elx) elx.addEventListener('change', function () { doSearch(1); });
  });
  $('#btnScan').addEventListener('click', function () { doScan(false); });
  $('#btnScanForce').addEventListener('click', function () { doScan(true); });
  $('#btnUpload').addEventListener('click', doUpload);
  $('#btnListReload').addEventListener('click', function () { loadList(1); });
  $('#listKeyword').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadList(1); });
  $('#listType').addEventListener('change', function () { loadList(1); });
  $('#btnAutoOn').addEventListener('click', function () { setAutoScan(true); });
  $('#btnAutoOff').addEventListener('click', function () { setAutoScan(false); });
  $('#btnOcrRun').addEventListener('click', doOcrRun);
  $('#btnFindDup').addEventListener('click', doFindDuplicates);
  $('#btnSaveOcrLimit').addEventListener('click', saveOcrLimit);
  $('#btnOcrAutoOn').addEventListener('click', function () { setOcrAuto(true); });
  $('#btnOcrAutoOff').addEventListener('click', function () { setOcrAuto(false); });
  $('#btnAddType').addEventListener('click', addTypeRow);
  $('#btnSaveTypes').addEventListener('click', saveTypes);
  $('#btnResetTypes').addEventListener('click', resetTypes);
  $('#btnAddIssuer').addEventListener('click', addIssuerRow);
  $('#btnSaveIssuers').addEventListener('click', saveIssuers);
  $('#btnResetIssuers').addEventListener('click', resetIssuers);
  $('#btnSaveVision').addEventListener('click', saveVision);
  $('#btnTestVision').addEventListener('click', testVision);
  $('#btnClearVision').addEventListener('click', clearVision);
  $('#btnChangePassword').addEventListener('click', changeOwnPassword);
  var blc = $('#btnLogoCheck'); if (blc) blc.addEventListener('click', checkLogo);
  var blt = $('#btnLoadTrash'); if (blt) blt.addEventListener('click', loadTrash);
  var bet = $('#btnEmptyTrash'); if (bet) bet.addEventListener('click', emptyTrashUi);
  var bla = $('#btnLoadAudit'); if (bla) bla.addEventListener('click', loadAudit);
  $('#btnAddAccount').addEventListener('click', function () { openAccountEditor(null); });
  $('#modalClose').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
}

/* ============ Trạng thái hệ thống ============ */
function loadStatus() {
  showLoading(true, 'Đang tải hệ thống...');
  call('getStatus').then(function (st) {
    STATE.status = st;
    STATE.docTypes = st.docTypes || [];
    STATE.issuers = st.issuers || [];
    STATE.issuerLevels = st.issuerLevels || [];
    STATE.statusOptions = st.statusOptions || [];
    STATE.securityOptions = st.securityOptions || [];
    STATE.urgencyOptions = st.urgencyOptions || [];
    STATE.me = st.me || STATE.me;
    showApp();
    renderUserBox();
    applyAcl();
    $('#initBanner').classList.toggle('hidden', st.initialized);
    fillTypeSelects();
    fillLevelSelect();
    renderSysInfo();
    renderStatCardsFromStatus();
    renderOcrQueue();
    loadStats();
    showLoading(false);
    // Tìm kiếm là màn hình mặc định: tự nạp toàn bộ văn bản ngay khi mở app.
    if (st.initialized && !STATE.searched) doSearch(1, true);
  }).catch(function (err) {
    showLoading(false);
    if (err && /^AUTH:/.test(err.message || '')) return; // đã chuyển về đăng nhập
    toast('Lỗi tải trạng thái: ' + (err.message || err), 'err');
  });
}

function can(perm) { return !!(STATE.me && STATE.me.perms && STATE.me.perms[perm]); }
// Tài khoản 'free' không hiển thị trạng thái xử lý / độ mật / độ khẩn.
function showWorkflow() { return !(STATE.me && STATE.me.role === 'free'); }

function renderUserBox() {
  var me = STATE.me || {};
  var roleLabel = roleLabel_(me.role);
  $('#userBox').innerHTML =
    '<span>' + esc(me.name || me.email || '') + ' <span class="tag">' + roleLabel + '</span></span> ' +
    '<button class="btn btn-logout" id="btnLogout">Đăng xuất</button>';
  var b = $('#btnLogout');
  if (b) b.addEventListener('click', function () { doLogout(false); });
}

// Ẩn/hiện tab & nút theo quyền của tài khoản đang đăng nhập.
function applyAcl() {
  // Tab Quét chỉ cho quyền scan; tab Cài đặt luôn hiện (ai cũng đổi được mật khẩu).
  setTabVisible('scan', can('scan'));
  toggleEl('#cardVision', can('config'));
  toggleEl('#cardTypes', can('config'));
  toggleEl('#cardIssuers', can('config'));
  toggleEl('#cardAccounts', can('accounts'));
  toggleEl('#cardAudit', can('accounts'));
  toggleEl('#cardTrash', can('delete'));
  toggleEl('#btnInit', can('config'));
  // Tài khoản free: ẩn ô lọc trạng thái & độ mật.
  toggleEl('#fStatus', showWorkflow());
  toggleEl('#fSecurity', showWorkflow());
}
function setTabVisible(name, on) {
  var tab = document.querySelector('.tab[data-tab="' + name + '"]');
  if (tab) tab.style.display = on ? '' : 'none';
}
function toggleEl(sel, on) {
  var e = $(sel);
  if (e) e.classList.toggle('hidden', !on);
}

function doInitialize() {
  showLoading(true, 'Đang khởi tạo folder và cơ sở dữ liệu...');
  call('initialize').then(function (st) {
    STATE.status = st;
    STATE.docTypes = st.docTypes || [];
    STATE.issuers = st.issuers || [];
    STATE.issuerLevels = st.issuerLevels || [];
    STATE.statusOptions = st.statusOptions || [];
    STATE.securityOptions = st.securityOptions || [];
    STATE.urgencyOptions = st.urgencyOptions || [];
    $('#initBanner').classList.add('hidden');
    fillTypeSelects();
    fillLevelSelect();
    renderSysInfo();
    showLoading(false);
    toast('Đã khởi tạo hệ thống thành công!', 'ok');
    loadUploadHint();
  }).catch(function (err) {
    showLoading(false);
    toast('Lỗi khởi tạo: ' + (err.message || err), 'err');
  });
}

function fillTypeSelects() {
  var opts = '<option value="">— Tất cả loại —</option>';
  STATE.docTypes.forEach(function (t) {
    opts += '<option value="' + esc(t.code) + '">' + esc(t.name) + '</option>';
  });
  $('#sType').innerHTML = opts;
  $('#listType').innerHTML = opts;
}

function fillLevelSelect() {
  var sel = $('#sLevel');
  if (sel) {
    var opts = '<option value="">— Tất cả cấp —</option>';
    (STATE.issuerLevels || []).forEach(function (lv) {
      opts += '<option value="' + esc(lv) + '">' + esc(lv) + '</option>';
    });
    sel.innerHTML = opts;
  }
  // Gợi ý đơn vị cho ô tìm kiếm.
  var dl = $('#issuerListSearch');
  if (dl) {
    dl.innerHTML = (STATE.issuers || []).map(function (it) {
      return '<option value="' + esc(it.name) + '">';
    }).join('');
  }
  // Bộ lọc trạng thái & độ mật.
  var ss = $('#sStatus');
  if (ss) ss.innerHTML = '<option value="">— Trạng thái —</option>' +
    (STATE.statusOptions || []).map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('');
  var sc = $('#sSecurity');
  if (sc) sc.innerHTML = '<option value="">— Độ mật —</option>' +
    (STATE.securityOptions || []).map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('');
}

/* ============ Tổng quan ============ */
function renderStatCardsFromStatus() {
  var st = STATE.status || {};
  $('#statCards').innerHTML =
    statCard(st.totalDocs || 0, 'Tổng số văn bản') +
    statCard((st.docTypes || []).length, 'Loại văn bản') +
    statCard(st.autoScan ? 'Bật' : 'Tắt', 'Tự động quét') +
    statCardText(fmtDateTime(st.lastScan), 'Quét gần nhất');
}
function statCard(num, lbl) {
  return '<div class="stat-card"><div class="num">' + esc(num) + '</div><div class="lbl">' + esc(lbl) + '</div></div>';
}
function statCardText(text, lbl) {
  return '<div class="stat-card"><div class="num" style="font-size:15px;padding-top:8px">' + esc(text) + '</div><div class="lbl">' + esc(lbl) + '</div></div>';
}

function loadStats() {
  call('getStats').then(function (s) {
    if (!s) return;
    renderBarList('#typeChart', (s.byType || []).map(function (t) { return { label: t.name, count: t.count }; }));
    renderBarList('#yearChart', (s.byYear || []).map(function (y) { return { label: y.year, count: y.count }; }));
    renderBarList('#levelChart', (s.byLevel || []).map(function (l) { return { label: l.level, count: l.count }; }));
  }).catch(function () {});
}
function renderBarList(sel, items) {
  var box = $(sel);
  if (!items || !items.length) { box.innerHTML = '<div class="empty">Chưa có dữ liệu</div>'; return; }
  var max = Math.max.apply(null, items.map(function (i) { return i.count; })) || 1;
  box.innerHTML = items.map(function (i) {
    var pct = Math.round(i.count / max * 100);
    return '<div class="bar-row"><div class="bar-label"><span>' + esc(i.label) + '</span><b>' + i.count + '</b></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
  }).join('');
}

/* ============ Danh sách ============ */
function loadList(page) {
  if (!STATE.status || !STATE.status.initialized) { $('#listResults').innerHTML = notInit(); return; }
  STATE.listPage = page || 1;
  var q = {
    keyword: $('#listKeyword').value.trim(),
    typeCode: $('#listType').value,
    sortBy: 'issuedDate', sortDir: 'desc',
    page: page || 1, pageSize: 15
  };
  showLoading(true, 'Đang tải danh sách...');
  call('search', q).then(function (res) {
    renderResults('#listResults', res, q.keyword);
    renderPager('#listPager', res, loadList);
    showLoading(false);
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}

/* ============ Tìm kiếm ============ */
function doSearch(page, silent) {
  if (!STATE.status || !STATE.status.initialized) { $('#searchResults').innerHTML = notInit(); return; }
  STATE.searchPage = page || 1;
  STATE.searched = true;
  var sort = ($('#sSort').value || 'issuedDate|desc').split('|');
  var q = {
    keyword: $('#sKeyword').value.trim(),
    typeCode: $('#sType').value,
    issuerLevel: $('#sLevel').value,
    issuer: $('#sIssuer') ? $('#sIssuer').value.trim() : '',
    docNumber: $('#sNumber') ? $('#sNumber').value.trim() : '',
    status: $('#sStatus') ? $('#sStatus').value : '',
    security: $('#sSecurity') ? $('#sSecurity').value : '',
    fromDate: dmyToIso($('#sFrom').value),
    toDate: dmyToIso($('#sTo').value),
    sortBy: sort[0], sortDir: sort[1],
    page: page || 1, pageSize: 15
  };
  if (!silent) showLoading(true, 'Đang tìm kiếm...');
  call('search', q).then(function (res) {
    renderResults('#searchResults', res, q.keyword);
    renderPager('#searchPager', res, doSearch);
    var sum = $('#searchSummary');
    if (sum) sum.textContent = 'Tìm thấy ' + (res.total || 0) + ' văn bản.';
    showLoading(false);
    if (res.total === 0 && !silent) toast('Không tìm thấy văn bản phù hợp.');
  }).catch(function (err) { showLoading(false); if (!silent) toast('Lỗi: ' + (err.message || err), 'err'); });
}

function doExport() {
  if (!STATE.status || !STATE.status.initialized) { toast('Hãy khởi tạo hệ thống trước.', 'err'); return; }
  var sort = ($('#sSort').value || 'issuedDate|desc').split('|');
  var q = {
    keyword: $('#sKeyword').value.trim(),
    typeCode: $('#sType').value,
    issuerLevel: $('#sLevel').value,
    issuer: $('#sIssuer').value.trim(),
    docNumber: $('#sNumber').value.trim(),
    status: $('#sStatus').value,
    security: $('#sSecurity').value,
    fromDate: dmyToIso($('#sFrom').value),
    toDate: dmyToIso($('#sTo').value),
    sortBy: sort[0], sortDir: sort[1]
  };
  showLoading(true, 'Đang tạo file Excel...');
  call('exportCsv', q).then(function (r) {
    showLoading(false);
    if (!r.count) { toast('Không có văn bản để xuất.', 'err'); return; }
    // Thêm BOM để Excel đọc đúng tiếng Việt (UTF-8).
    var blob = new Blob(['﻿' + r.csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = r.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('Đã xuất ' + r.count + ' văn bản ra ' + r.filename, 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi xuất: ' + (err.message || err), 'err'); });
}

function clearSearch() {
  ['sKeyword', 'sIssuer', 'sNumber', 'sFrom', 'sTo'].forEach(function (id) {
    var e = document.getElementById(id); if (e) e.value = '';
  });
  if ($('#sType')) $('#sType').value = '';
  if ($('#sLevel')) $('#sLevel').value = '';
  if ($('#sStatus')) $('#sStatus').value = '';
  if ($('#sSecurity')) $('#sSecurity').value = '';
  if ($('#sSort')) $('#sSort').value = 'issuedDate|desc';
  doSearch(1);
}

// Làm mới kết quả đang xem (sau khi sửa/OCR) mà không cần refresh trang.
function refreshResults() {
  var activeEl = document.querySelector('.tab.active');
  var active = activeEl ? activeEl.dataset.tab : '';
  if (active === 'search' || STATE.searched) doSearch(STATE.searchPage || 1, true);
  if (active === 'list') loadList(STATE.listPage || 1);
}

function notInit() {
  return '<div class="empty">Hệ thống chưa được khởi tạo. Vào tab bất kỳ và nhấn "Khởi tạo hệ thống".</div>';
}

function renderResults(sel, res, keyword) {
  var box = $(sel);
  if (!res) { res = { items: [], total: 0, page: 1, totalPages: 1 }; }
  if (!res.items || !res.items.length) {
    box.innerHTML = '<div class="empty">Không có văn bản nào.<br><span class="muted">Hãy tải văn bản lên folder Drive rồi vào tab "Quét &amp; Cập nhật".</span></div>';
    return;
  }
  box.innerHTML = '';
  var terms = (keyword || '').toLowerCase().split(/\s+/).filter(Boolean);
  res.items.forEach(function (d) {
    var item = el('div', 'doc-item');
    var badge = el('div', 'doc-badge', esc(d.docTypeCode || '?'));
    var main = el('div', 'doc-main');
    main.innerHTML =
      '<div class="doc-title">' + esc(d.title || d.fileName) + '</div>' +
      '<div class="doc-meta">' +
        '<span><b>' + esc(d.docType || 'Khác') + '</b></span>' +
        (d.docNumber ? '<span>Số: <b>' + esc(d.docNumber) + '</b></span>' : '') +
        '<span>Ngày BH: <b>' + fmtDate(d.issuedDate) + '</b></span>' +
        (d.issuer ? '<span>ĐV: <b>' + esc(d.issuer) + '</b>' + (d.issuerLevel ? ' <span class="tag">' + esc(d.issuerLevel) + '</span>' : '') + '</span>' : (d.issuerLevel ? '<span class="tag">' + esc(d.issuerLevel) + '</span>' : '')) +
        '<span>' + esc(d.fileName) + '</span>' +
        '<span class="tag ' + esc(d.ocrStatus) + '">' + ocrLabel(d.ocrStatus) + '</span>' +
        (showWorkflow() && d.status ? '<span class="tag st-' + statusClass_(d.status) + '">' + esc(d.status) + '</span>' : '') +
        (showWorkflow() && d.security && d.security !== 'Thường' ? '<span class="tag sec">' + esc(d.security) + '</span>' : '') +
        (showWorkflow() && d.urgency && d.urgency !== 'Thường' ? '<span class="tag urg">' + esc(d.urgency) + '</span>' : '') +
      '</div>' +
      (d.snippet ? '<div class="doc-snippet">' + highlight(esc(d.snippet), terms) + '</div>' : '');
    var actions = el('div', 'doc-actions');
    var btnView = el('button', 'btn', 'Xem');
    btnView.addEventListener('click', function () { openDetail(d.fileId); });
    var btnOpen = el('a', 'btn', 'Mở file');
    btnOpen.href = d.fileUrl; btnOpen.target = '_blank';
    actions.appendChild(btnView);
    actions.appendChild(btnOpen);
    item.appendChild(badge); item.appendChild(main); item.appendChild(actions);
    box.appendChild(item);
  });
}
function statusClass_(s) {
  return { 'Mới': 'new', 'Đang xử lý': 'proc', 'Hoàn thành': 'done', 'Lưu trữ': 'arch' }[s] || 'new';
}
function ocrLabel(s) {
  if (s === 'ok') return 'Đã trích xuất';
  if (s === 'ok-vision') return 'OCR nâng cao (Vision)';
  if (s === 'manual') return 'Đã sửa tay';
  if (s === 'pending') return 'Đang chờ OCR';
  if (s === 'partial') return 'Đang OCR dở';
  if (s === 'skip') return 'Không OCR';
  if (s === 'skip-large') return 'File quá lớn - bỏ OCR';
  if (s === 'error') return 'Lỗi OCR';
  return s || '';
}
function highlight(text, terms) {
  if (!terms || !terms.length) return text;
  terms.forEach(function (t) {
    if (t.length < 2) return;
    try {
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      text = text.replace(re, '<mark>$1</mark>');
    } catch (e) {}
  });
  return text;
}

function renderPager(sel, res, fn) {
  var box = $(sel);
  box.innerHTML = '';
  if (!res) return;
  if (res.totalPages <= 1) {
    if (res.total) box.innerHTML = '<span class="muted">Tổng ' + res.total + ' văn bản</span>';
    return;
  }
  var info = el('span', 'muted', 'Tổng ' + res.total + ' VB — Trang ' + res.page + '/' + res.totalPages + '&nbsp;&nbsp;');
  box.appendChild(info);
  var start = Math.max(1, res.page - 2);
  var end = Math.min(res.totalPages, start + 4);
  if (res.page > 1) addPage(box, '‹', res.page - 1, fn, false);
  for (var p = start; p <= end; p++) addPage(box, p, p, fn, p === res.page);
  if (res.page < res.totalPages) addPage(box, '›', res.page + 1, fn, false);
}
function addPage(box, label, page, fn, active) {
  var b = el('button', active ? 'active' : '', String(label));
  b.addEventListener('click', function () { fn(page); });
  box.appendChild(b);
}

/* ============ Chi tiết ============ */
// Iframe xem bản gốc (PDF/ảnh) của Google Drive. cls: class CSS bổ sung.
function previewIframe_(d, cls) {
  var mt = d.mimeType || '';
  var isPdf = mt === 'application/pdf';
  var isImg = mt.indexOf('image/') === 0;
  if (!isPdf && !isImg) return '';
  var url = 'https://drive.google.com/file/d/' + encodeURIComponent(d.fileId) + '/preview';
  return '<iframe class="doc-preview ' + (cls || '') + '" src="' + url + '"></iframe>';
}
function previewBlock_(d) {
  var f = previewIframe_(d);
  return f ? ('<h3 style="margin-top:16px">Bản gốc (PDF/ảnh)</h3>' + f) : '';
}
function setModalWide_(on) {
  var box = document.querySelector('#modal .modal-box');
  if (box) box.classList.toggle('wide', !!on);
}

          '<h2>' + esc(d.title || d.fileName) + '</h2>' +

            (showWorkflow() && d.status ? chip(d.status) : '') +
            (showWorkflow() && d.security && d.security !== 'Thường' ? chip(d.security) : '') +
            (showWorkflow() && d.urgency && d.urgency !== 'Thường' ? chip(d.urgency) : '') +

        '</div>' +

        (can('scan') ? '<button class="btn" id="btnReOcr">OCR lại</button>' : '') +
        (can('delete') ? '<button class="btn btn-danger" id="btnDeleteDoc">🗑 Xoá văn bản</button>' : '') +
      '</div>' +
      previewBlock_(d) +
      '<details class="detail-more" id="detailMore" open><summary>Thông tin chi tiết</summary>' +
      '<div class="sys-info" style="margin-top:10px">' +
        row('Loại VB', esc(d.docType) + ' (' + esc(d.docTypeCode) + ')') +
        row('Số/Ký hiệu', esc(d.docNumber || '—')) +
        row('Đơn vị ban hành', esc(d.issuer || '—')) +
        row('Cấp ban hành', esc(d.issuerLevel || '—')) +
        (showWorkflow() ? row('Trạng thái xử lý', esc(d.status || '—')) : '') +
        (showWorkflow() ? row('Độ mật', esc(d.security || '—')) : '') +
        (showWorkflow() ? row('Độ khẩn', esc(d.urgency || '—')) : '') +
        row('Ngày ban hành', fmtDate(d.issuedDate)) +

      '<div class="detail-content">' + (d.content ? esc(d.content) : '<i>Chưa có nội dung OCR. Xem bản gốc phía trên; nội dung sẽ có sau khi hàng đợi OCR xử lý, hoặc bấm "OCR lại" / "Sửa thông tin".</i>') + '</div>';

/* ============ Sửa thông tin bằng tay ============ */
function optList_(options, sel) {

}

/* ============ Quét ============ */
function loadUploadHint() {
  if (!STATE.status || !STATE.status.initialized) {
    $('#uploadHint').innerHTML = 'Hãy khởi tạo hệ thống trước (banner phía trên).';
    return;
  }
  call('getUploadInfo').then(function (info) {
    $('#uploadHint').innerHTML =
      '📁 Tải văn bản (PDF, ảnh scan, Word, Google Docs) vào folder gốc: ' +
      '<a href="' + esc(info.folderUrl) + '" target="_blank"><b>' + esc(info.folderName) + '</b></a> ' +
      'rồi nhấn <b>Quét ngay</b>.';
  }).catch(function () {});
}

function doScan(force) {
  if (!STATE.status || !STATE.status.initialized) { toast('Hãy khởi tạo hệ thống trước.', 'err'); return; }
  showLoading(true, force ? 'Đang quét lại toàn bộ & OCR...' : 'Đang quét Drive...');
  call('scan', { force: force }).then(function (s) {
    showLoading(false);
    $('#scanResult').innerHTML =
      '<div class="muted" style="margin-bottom:6px">Kết quả quét:</div>' +
      scanStat('Đã xử lý', s.scanned) +
      scanStat('Thêm mới', s.inserted) +
      scanStat('Cập nhật', s.updated) +
      scanStat('Xếp hàng đợi OCR', s.queued) +
      scanStat('Bỏ qua', s.skipped) +
      scanStat('Đã xoá', s.deleted) +
      scanStat('Nghi trùng', s.duplicates) +
      scanStat('Lỗi', s.errors) +
      (s.limitHit ? '<div class="upload-hint" style="margin-top:10px">Còn văn bản chưa xử lý (giới hạn mỗi lượt). Nhấn <b>Quét ngay</b> lần nữa để tiếp tục.</div>' : '');
    toast('Quét xong: +' + s.inserted + ' mới, ' + s.updated + ' cập nhật, ' + s.queued + ' chờ OCR.', 'ok');
    loadStatus();
    renderOcrQueue();
    setTimeout(renderDupStatus, 400);
  }).catch(function (err) { showLoading(false); toast('Lỗi quét: ' + (err.message || err), 'err'); });
}
function scanStat(lbl, num) {
  return '<span class="scan-stat">' + esc(lbl) + ': <b>' + (num || 0) + '</b></span>';
}

function setAutoScan(enable) {
  var hours = parseInt($('#autoHours').value, 10);
  showLoading(true, 'Đang cập nhật lịch quét...');
  call('setAutoScan', { enable: enable, hours: hours }).then(function (r) {
    showLoading(false);
    toast(r.message, 'ok');
    $('#autoStatus').innerHTML = r.autoScan ? 'Trạng thái: <b>Đang bật</b>' : 'Trạng thái: <b>Đã tắt</b>';
    loadStatus();
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}

/* ============ Kiểm tra trùng lặp ============ */
function renderDupStatus() {
  var box = $('#dupStatus'); if (!box) return;
  var st = STATE.status || {};
  var n = st.duplicates || 0;
  box.innerHTML = n > 0
    ? '<span class="tag error">Nghi trùng: ' + n + ' văn bản</span> — bấm "Rà soát trùng lặp" để xem chi tiết.'
    : '<span class="tag ok">Chưa phát hiện trùng lặp</span> (theo lần quét gần nhất).';
}
function doFindDuplicates() {
  if (!STATE.status || !STATE.status.initialized) { toast('Hãy khởi tạo hệ thống trước.', 'err'); return; }
  showLoading(true, 'Đang rà soát trùng lặp...');
  call('findDuplicates').then(function (res) {
    showLoading(false);
    if (STATE.status) STATE.status.duplicates = res.docsAffected;
    renderDupStatus();
    renderDupGroups(res);
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
function renderDupGroups(res) {
  var box = $('#dupResult');
  if (!res.groups || !res.groups.length) {
    box.innerHTML = '<div class="empty" style="padding:20px 0">Không phát hiện văn bản trùng lặp. 🎉</div>';
    return;
  }
  var html = '<div class="muted" style="margin:10px 0 6px">Tìm thấy <b>' + res.total + '</b> nhóm nghi trùng (' + res.docsAffected + ' văn bản):</div>';
  res.groups.forEach(function (g, gi) {
    html += '<div class="dup-group">' +
      '<div class="dup-head">Nhóm ' + (gi + 1) + ' — <span class="tag error">' + esc(g.reason) + '</span> (' + g.docs.length + ' VB)</div>';
    g.docs.forEach(function (d) {
      html += '<div class="dup-item">' +
        '<div class="dup-info"><b>' + esc(d.title || d.fileName) + '</b>' +
          '<div class="muted" style="font-size:12px">' +
            (d.docNumber ? 'Số: ' + esc(d.docNumber) + ' • ' : '') +
            'Ngày: ' + fmtDate(d.issuedDate) + ' • ' + esc(d.fileName) +
          '</div></div>' +
        '<div class="dup-actions">' +
          '<button class="btn" data-dup-view="' + esc(d.fileId) + '">Xem</button>' +
          (can('delete') ? '<button class="btn btn-danger" data-dup-del="' + esc(d.fileId) + '" data-name="' + esc(d.title || d.fileName) + '">Xoá</button>' : '') +
        '</div></div>';
    });
    html += '</div>';
  });
  box.innerHTML = html;
  $all('[data-dup-view]', box).forEach(function (b) {
    b.addEventListener('click', function () { openDetail(b.getAttribute('data-dup-view')); });
  });
  $all('[data-dup-del]', box).forEach(function (b) {
    b.addEventListener('click', function () {
      openConfirm_('Xoá văn bản "' + b.getAttribute('data-name') + '"?\n\nVăn bản sẽ vào Thùng rác của app (khôi phục được).', function () {
        showLoading(true, 'Đang xoá...');
        call('deleteDoc', { fileId: b.getAttribute('data-dup-del') }).then(function () {
          showLoading(false);
          toast('Đã xoá. Đang rà soát lại...', 'ok');
          doFindDuplicates();
          loadStatus();
        }).catch(function (err) { showLoading(false); toast('Lỗi xoá: ' + (err.message || err), 'err'); });
      });
    });
  });
}

/* ============ Tải file lên ============ */
function doUpload() {
  var input = $('#uploadInput');
  var files = input.files;
  if (!files || !files.length) { toast('Hãy chọn file trước.', 'err'); return; }
  var MAX = 25 * 1024 * 1024;
  var list = Array.prototype.slice.call(files);
  var big = list.filter(function (f) { return f.size > MAX; });
  if (big.length) { toast('Có file > 25MB (' + big[0].name + '). Hãy tách nhỏ trước khi tải.', 'err'); return; }

  var box = $('#uploadResult');
  var done = 0, ok = 0, err = 0;
  box.innerHTML = 'Đang tải lên 0/' + list.length + '...';
  showLoading(true, 'Đang tải lên...');

  function next(i) {
    if (i >= list.length) {
      showLoading(false);
      box.innerHTML = 'Hoàn tất: <b>' + ok + '</b> thành công' + (err ? ', <b>' + err + '</b> lỗi' : '') + '. Ảnh/PDF đã được xếp hàng đợi OCR.';
      toast('Đã tải lên ' + ok + ' file.', 'ok');
      input.value = '';
      loadStatus();
      refreshResults();
      return;
    }
    var f = list[i];
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(',')[1] || '';
      call('uploadFile', { name: f.name, mimeType: f.type || 'application/octet-stream', dataBase64: b64 })
        .then(function () { ok++; })
        .catch(function () { err++; })
        .then(function () {
          done++;
          box.innerHTML = 'Đang tải lên ' + done + '/' + list.length + '...';
          next(i + 1);
        });
    };
    reader.onerror = function () { err++; done++; next(i + 1); };
    reader.readAsDataURL(f);
  }
  next(0);
}

      '<label>Trạng thái<select id="acActive" class="input"><option value="1"' + (acc.active ? ' selected' : '') + '>Hoạt động</option><option value="0"' + (!acc.active ? ' selected' : '') + '>Khoá</option></select></label>' +
      '<label class="full">Mật khẩu ' + (isNew ? '(bắt buộc)' : '(để trống nếu không đổi)') + '<input id="acPass" type="password" class="input" autocomplete="new-password" placeholder="Từ 6 ký tự"></label>' +
      '<div class="full"><div class="muted" style="margin-bottom:4px">Quyền chi tiết (Quản trị viên luôn có mọi quyền):</div><div class="perm-grid">' + permBoxes + '</div></div>' +
    '</div>' +
    '<div class="form-row" style="margin-top:14px">' +
      '<button class="btn btn-primary" id="btnSaveAccount">Lưu</button>' +
      '<button class="btn" id="btnCancelAccount">Huỷ</button>' +
    '</div>';
  $('#modalContent').innerHTML = html;
  setModalWide_(false);
  $('#modal').classList.remove('hidden');
  // Chọn vai trò -> tự tick quyền mặc định.
  $('#acRole').addEventListener('change', function () {
    var preset = { free: ['view'], viewer: ['view'], editor: ['view', 'edit', 'scan'], admin: ['view', 'edit', 'delete', 'scan', 'config', 'accounts'] }[this.value] || ['view'];
    $all('[data-perm]').forEach(function (cb) { cb.checked = preset.indexOf(cb.getAttribute('data-perm')) !== -1; });
  });
  $('#btnCancelAccount').addEventListener('click', closeModal);
  $('#btnSaveAccount').addEventListener('click', function () { saveAccountForm(isNew); });
}
function saveAccountForm(isNew) {
  var perms = {};
  $all('[data-perm]').forEach(function (cb) { perms[cb.getAttribute('data-perm')] = cb.checked; });
  var payload = {
    email: $('#acEmail').value.trim(),
    name: $('#acName').value.trim(),
    role: $('#acRole').value,
    active: $('#acActive').value === '1',
    perms: perms,
    password: $('#acPass').value
  };
  if (!payload.email) { toast('Nhập email.', 'err'); return; }
  showLoading(true, 'Đang lưu tài khoản...');
  call('saveAccount', payload).then(function () {
    showLoading(false);
    closeModal();
    toast('Đã lưu tài khoản.', 'ok');
    renderAccounts();
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
function deleteAccountUi(email) {
  var np = null;
  openConfirm_('Xoá tài khoản ' + email + '?', function () {
    showLoading(true, 'Đang xoá...');
    call('deleteAccount', { email: email }).then(function () {
      showLoading(false); toast('Đã xoá tài khoản.', 'ok'); renderAccounts();
    }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
  });
}
function openConfirm_(msg, onYes) {
  var html = '<h2>Xác nhận</h2><p style="white-space:pre-line">' + esc(msg) + '</p>' +
    '<div class="form-row"><button class="btn btn-primary" id="cfYes">Đồng ý</button><button class="btn" id="cfNo">Huỷ</button></div>';
  $('#modalContent').innerHTML = html;
  setModalWide_(false);
  $('#modal').classList.remove('hidden');
  $('#cfNo').addEventListener('click', closeModal);
  $('#cfYes').addEventListener('click', function () { closeModal(); onYes(); });
}

/* ============ OCR nâng cao (Vision) ============ */
function renderVisionStatus() {
  var st = STATE.status || {};
  var box = $('#visionStatus');
  if (!box) return;
  if (st.visionEnabled) {
    box.innerHTML = 'Động cơ OCR hiện tại: <b>Google Cloud Vision (nâng cao)</b> <span class="tag ok">Đang bật</span>';
  } else {
    box.innerHTML = 'Động cơ OCR hiện tại: <b>Drive OCR (cơ bản)</b> <span class="tag skip">Chưa bật Vision</span>';
  }
}
function saveVision() {
  var key = $('#visionKey').value.trim();
  if (!key) { toast('Hãy dán API key trước.', 'err'); return; }
  showLoading(true, 'Đang lưu API key...');
  call('setVisionKey', { key: key }).then(function (r) {
    showLoading(false);
    if (STATE.status) STATE.status.visionEnabled = r.visionEnabled;
    $('#visionKey').value = '';
    renderVisionStatus();
    renderSysInfo();
    toast('Đã lưu API key. Bấm "Kiểm tra" để xác nhận, rồi "Quét lại toàn bộ" để OCR lại.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
function testVision() {
  showLoading(true, 'Đang kiểm tra API key...');
  call('testVision').then(function (r) {
    showLoading(false);
    toast(r.message, r.ok ? 'ok' : 'err');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
function clearVision() {
  showLoading(true, 'Đang xoá API key...');
  call('setVisionKey', { key: '' }).then(function (r) {
    showLoading(false);
    if (STATE.status) STATE.status.visionEnabled = r.visionEnabled;
    renderVisionStatus();
    renderSysInfo();
    toast('Đã xoá API key. Quay lại dùng Drive OCR.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
</script>
