<style>
  :root {
    --primary: #0B5394;
    --primary-dark: #073763;
    --primary-light: #e8f0fe;
    --accent: #c9302c;
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #202124;
    --muted: #5f6368;
    --border: #e0e3e7;
    --ok: #188038;
    --warn: #e37400;
    --err: #c5221f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  .hidden { display: none !important; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header */
  .topbar {
    background: linear-gradient(90deg, var(--primary-dark), var(--primary));
    color: #fff; padding: 14px 24px; display: flex; align-items: center;
    justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,.15);
    gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 10px; background: #fff;
    display: flex; align-items: center; justify-content: center; padding: 5px;
  }
  .epu-mark { width: 100%; height: 100%; display: block; object-fit: contain; }
  .brand-text h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .brand-text p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  .user-box { font-size: 12px; opacity: .95; text-align: right; display: flex; align-items: center; gap: 10px; }
  .user-box .tag { background: rgba(255,255,255,.2); color: #fff; }
  .btn-logout { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.4); padding: 6px 12px; }
  .btn-logout:hover { background: rgba(255,255,255,.28); }

  /* Màn hình đăng nhập */
  .login-screen {
    position: fixed; inset: 0; background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    display: flex; align-items: center; justify-content: center; z-index: 800; padding: 20px;
  }
  .login-box {
    background: #fff; border-radius: 14px; padding: 32px 28px; width: 100%; max-width: 380px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3); text-align: center;
  }
  .login-logo {
    width: 76px; height: 76px; border-radius: 14px; background: #fff; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; padding: 8px;
  }
  .login-dev { font-size: 12px; color: var(--muted); margin: 16px 0 0; }
  .login-box h1 { font-size: 18px; margin: 0 0 4px; color: var(--primary-dark); }
  .login-sub { font-size: 13px; color: var(--muted); margin: 0 0 20px; }
  .login-field { display: flex; flex-direction: column; gap: 5px; text-align: left; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .login-btn { width: 100%; padding: 11px; font-size: 15px; margin-top: 4px; }
  .login-error { color: var(--err); font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .login-hint { font-size: 12px; margin-top: 16px; }

  /* Phân quyền */
  .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .perm-check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
  @media (max-width: 560px){ .perm-grid { grid-template-columns: 1fr; } }

  /* Init banner */
  .init-banner {
    background: #fff8e1; border: 1px solid #ffe082; color: #6d4c00;
    margin: 16px 24px 0; padding: 14px 18px; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }

  /* Tabs */
  .tabs {
    display: flex; gap: 4px; padding: 0 24px; margin-top: 14px;
    border-bottom: 1px solid var(--border); background: transparent; flex-wrap: wrap;
  }
  .tab {
    border: none; background: none; padding: 12px 18px; cursor: pointer;
    font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent;
    font-weight: 500;
  }
  .tab:hover { color: var(--primary); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  .content { padding: 20px 24px 20px; max-width: 1180px; margin: 0 auto; }
  .app-footer {
    text-align: center; color: var(--muted); font-size: 12px; padding: 16px 24px 30px;
    border-top: 1px solid var(--border); margin-top: 10px;
  }
  .app-footer a { color: var(--primary); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px);} to {opacity:1;transform:none;} }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 18px;
  }
  .card h3 { margin: 0 0 10px; font-size: 15px; color: var(--primary-dark); }
  .muted { color: var(--muted); font-size: 13px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px){ .two-col { grid-template-columns: 1fr; } }

  /* Stat cards */
  .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  @media (max-width: 800px){ .stat-cards { grid-template-columns: repeat(2,1fr);} }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align: center;
  }
  .stat-card .num { font-size: 30px; font-weight: 700; color: var(--primary); }
  .stat-card .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Bar list */
  .bar-list .bar-row { margin-bottom: 10px; }
  .bar-row .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar-track { background: var(--primary-light); border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--primary); height: 100%; border-radius: 6px; }

  /* Buttons */
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .btn:hover { background: #f1f3f4; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-danger { background: #fff; color: var(--err); border-color: #f3b9b6; }
  .btn-danger:hover { background: #fce8e6; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Inputs */
  .input {
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-size: 13px; background: #fff; color: var(--text);
  }
  .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .input { flex: 0 0 auto; }
  #listKeyword { flex: 1 1 240px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
  .form-row label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  .grow { flex: 1; }
  .search-form .form-row:last-child { margin-bottom: 0; }

  /* Results */
  .results { display: flex; flex-direction: column; gap: 10px; }
  .doc-item {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start;
  }
  .doc-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(11,83,148,.08); }
  .doc-badge {
    flex: 0 0 auto; min-width: 54px; height: 54px; border-radius: 8px;
    background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
    text-align: center; padding: 4px;
  }
  .doc-main { flex: 1; min-width: 0; }
  .doc-title { font-weight: 600; color: var(--primary-dark); font-size: 14px; margin-bottom: 3px; }
  .doc-meta { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .doc-meta b { color: var(--text); font-weight: 600; }
  .doc-snippet { font-size: 12.5px; color: #444; line-height: 1.5; }
  .doc-snippet mark { background: #fff3a3; padding: 0 1px; }
  .doc-actions { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; background: var(--primary-light); color: var(--primary-dark); }
  .tag.ok { background: #e6f4ea; color: var(--ok); }
  .tag.skip { background: #f1f3f4; color: var(--muted); }
  .tag.error { background: #fce8e6; color: var(--err); }
  .tag.skip-large { background: #fef7e0; color: var(--warn); }
  .tag.ok-vision { background: #e6f4ea; color: var(--ok); }
  .tag.manual { background: #e8f0fe; color: var(--primary-dark); }
  .tag.pending { background: #fef7e0; color: var(--warn); }
  .tag.partial { background: #fff3cd; color: var(--warn); }
  .doc-preview { width: 100%; height: 62vh; min-height: 380px; border: 1px solid var(--border); border-radius: 8px; background: #f5f5f5; }
  @media (max-width: 640px){ .doc-preview { height: 68vh; } }

  /* Form sửa tay */
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .edit-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .edit-grid label.full { grid-column: 1 / -1; }
  .edit-grid textarea.input { resize: vertical; font-family: inherit; line-height: 1.5; }
  @media (max-width: 640px){ .edit-grid { grid-template-columns: 1fr; } }

  /* Sửa thông tin có xem PDF song song */
  .modal-box.wide { max-width: 1180px; }
  .edit-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .edit-preview { position: sticky; top: 0; }
  .edit-frame { width: 100%; height: 74vh; border: 1px solid var(--border); border-radius: 8px; }
  .edit-fields .edit-grid { grid-template-columns: 1fr; } /* cột phải: xếp dọc cho gọn */
  @media (max-width: 860px){
    .edit-layout { grid-template-columns: 1fr; }
    .edit-preview { position: static; }
    .edit-frame { height: 50vh; }
  }

  .pager { display: flex; gap: 6px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .pager button { min-width: 34px; }
  .pager button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* Scan */
  .scan-result { margin-top: 14px; }
  .scan-stat { display: inline-block; margin: 6px 14px 0 0; font-size: 13px; }
  .scan-stat b { color: var(--primary); font-size: 16px; }
  .upload-hint { background: var(--primary-light); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }

  /* Settings */
  .sys-info { display: grid; grid-template-columns: 160px 1fr; gap: 8px 14px; font-size: 13px; }
  .sys-info .k { color: var(--muted); }
  .types-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 13px; }
  .types-table th, .types-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .types-table th { background: var(--primary-light); color: var(--primary-dark); }
  .types-table input { width: 100%; border: none; padding: 4px; font-size: 13px; }
  .types-table input:focus { outline: 1px solid var(--primary); }

  /* Toast + modal + loading */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #323232; color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 13px; z-index: 1000; box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .toast.err { background: var(--err); }
  .toast.ok { background: var(--ok); }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 900;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-box {
    background: #fff; border-radius: 14px; max-width: 940px; width: 100%;
    max-height: 92vh; overflow: auto; padding: 26px 28px; position: relative;
    box-shadow: 0 12px 48px rgba(0,0,0,.28);
  }
  .modal-close {
    position: absolute; top: 10px; right: 12px; border: none; background: #f1f3f4;
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: #e3e6e8; color: var(--text); }
  .modal h2 { margin-top: 0; color: var(--primary-dark); font-size: 20px; padding-right: 36px; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; padding-right: 36px; }
  .detail-badge {
    flex: 0 0 auto; width: 60px; height: 60px; border-radius: 12px;
    background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; text-align: center; padding: 4px;
  }
  .detail-head h2 { padding-right: 0; font-size: 19px; }
  .detail-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--primary-light); color: var(--primary-dark); border-radius: 20px; padding: 3px 12px; font-size: 12.5px; font-weight: 500; }
  .detail-content {
    white-space: pre-wrap; background: #fafafa; border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; font-size: 14px; max-height: 46vh; overflow: auto;
    line-height: 1.6;
  }
  /* Cửa sổ full màn hình trên điện thoại */
  @media (max-width: 640px){
    .modal { padding: 0; }
    .modal-box { max-width: 100%; width: 100%; height: 100%; max-height: 100vh; border-radius: 0; padding: 18px 16px 24px; }
    .modal h2 { font-size: 18px; }
  }
  .loading {
    position: fixed; inset: 0; background: rgba(255,255,255,.7); z-index: 950;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: var(--primary-dark); font-size: 13px;
  }
  .spinner {
    width: 38px; height: 38px; border: 4px solid var(--primary-light);
    border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===================== Responsive (điện thoại/máy tính bảng) ===================== */
  @media (max-width: 720px){
    .topbar { padding: 12px 14px; }
    .brand-text h1 { font-size: 15px; }
    .brand-text p { font-size: 11px; }
    .user-box { font-size: 11px; gap: 8px; width: 100%; justify-content: flex-end; }
    .tabs { padding: 0 8px; margin-top: 10px; }
    .tab { padding: 10px 12px; font-size: 13px; }
    .content { padding: 14px 12px 16px; }
    .card { padding: 14px 14px; }
    .init-banner { margin: 12px 12px 0; flex-direction: column; align-items: stretch; }

    /* Danh sách văn bản: xếp gọn, nút xuống dòng */
    .doc-item { flex-wrap: wrap; gap: 10px; padding: 12px; }
    .doc-badge { min-width: 46px; height: 46px; font-size: 12px; }
    .doc-main { flex: 1 1 100%; order: 2; min-width: 0; }
    .doc-badge { order: 1; }
    .doc-actions { flex: 1 1 100%; order: 3; flex-direction: row; }
    .doc-actions .btn, .doc-actions a { flex: 1; text-align: center; }
    .doc-meta { gap: 8px 12px; }

    /* Thông tin hệ thống / chi tiết: gộp 1 cột */
    .sys-info { grid-template-columns: 110px 1fr; gap: 6px 10px; }

    /* Ô lọc tìm kiếm chiếm đủ chiều ngang */
    .form-row { gap: 10px; }
    .form-row label { flex: 1 1 100%; }
    .search-form .form-row label { flex: 1 1 45%; }
    #sKeyword { flex: 1 1 100%; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .input, .toolbar .btn { width: 100%; }

    /* Bảng trong Cài đặt cuộn ngang được */
    .types-table { display: block; overflow-x: auto; white-space: nowrap; }
  }
  @media (max-width: 420px){
    .stat-cards { grid-template-columns: 1fr 1fr; }
    .search-form .form-row label { flex: 1 1 100%; }
    .brand { gap: 10px; }
    .logo { width: 40px; height: 40px; }
  }
</style>
