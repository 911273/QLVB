<script>
/* ============ Tiện ích gọi server (Promise hoá google.script.run) ============ */
function call(fn, arg) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (err) { reject(err); })
      [fn](arg);
  });
}

var TYPE_ICONS = {}; // code -> short label
var STATE = { status: null, docTypes: [], issuers: [], issuerLevels: [] };

/* ============ Tiện ích UI ============ */
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function esc(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function showLoading(show, text) {
  var l = $('#loading');
  $('#loadingText').textContent = text || 'Đang xử lý...';
  l.classList.toggle('hidden', !show);
}
var toastTimer;
function toast(msg, type) {
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 3200);
}
function fmtDate(iso) {
  if (!iso) return '—';
  var p = String(iso).split('-');
  if (p.length === 3) return p[2] + '/' + p[1] + '/' + p[0];
  return iso;
}
function fmtDateTime(iso) {
  if (!iso) return 'Chưa quét';
  try { return new Date(iso).toLocaleString('vi-VN'); } catch (e) { return iso; }
}

/* ============ Khởi động ============ */
document.addEventListener('DOMContentLoaded', function () {
  bindTabs();
  bindActions();
  loadStatus();
});

function bindTabs() {
  $all('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      $all('.tab').forEach(function (t) { t.classList.remove('active'); });
      $all('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      $('#tab-' + tab.dataset.tab).classList.add('active');
      if (tab.dataset.tab === 'list') loadList(1);
      if (tab.dataset.tab === 'overview') loadStats();
      if (tab.dataset.tab === 'settings') { renderTypesTable(); renderIssuersTable(); renderVisionStatus(); }
      if (tab.dataset.tab === 'scan') { loadUploadHint(); renderOcrQueue(); }
    });
  });
}

function bindActions() {
  $('#btnInit').addEventListener('click', doInitialize);
  $('#btnSearch').addEventListener('click', function () { doSearch(1); });
  $('#btnSearchClear').addEventListener('click', clearSearch);
  $('#sKeyword').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(1); });
  $('#sIssuer').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(1); });
  $('#sNumber').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(1); });
  // Đổi bộ lọc là tự tìm lại ngay.
  ['sType', 'sLevel', 'sSort', 'sFrom', 'sTo'].forEach(function (id) {
    var elx = document.getElementById(id);
    if (elx) elx.addEventListener('change', function () { doSearch(1); });
  });
  $('#btnScan').addEventListener('click', function () { doScan(false); });
  $('#btnScanForce').addEventListener('click', function () { doScan(true); });
  $('#btnListReload').addEventListener('click', function () { loadList(1); });
  $('#listKeyword').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadList(1); });
  $('#listType').addEventListener('change', function () { loadList(1); });
  $('#btnAutoOn').addEventListener('click', function () { setAutoScan(true); });
  $('#btnAutoOff').addEventListener('click', function () { setAutoScan(false); });
  $('#btnOcrRun').addEventListener('click', doOcrRun);
  $('#btnSaveOcrLimit').addEventListener('click', saveOcrLimit);
  $('#btnOcrAutoOn').addEventListener('click', function () { setOcrAuto(true); });
  $('#btnOcrAutoOff').addEventListener('click', function () { setOcrAuto(false); });
  $('#btnAddType').addEventListener('click', addTypeRow);
  $('#btnSaveTypes').addEventListener('click', saveTypes);
  $('#btnResetTypes').addEventListener('click', resetTypes);
  $('#btnAddIssuer').addEventListener('click', addIssuerRow);
  $('#btnSaveIssuers').addEventListener('click', saveIssuers);
  $('#btnResetIssuers').addEventListener('click', resetIssuers);
  $('#btnSaveVision').addEventListener('click', saveVision);
  $('#btnTestVision').addEventListener('click', testVision);
  $('#btnClearVision').addEventListener('click', clearVision);
  $('#modalClose').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
}

/* ============ Trạng thái hệ thống ============ */
function loadStatus() {
  showLoading(true, 'Đang tải hệ thống...');
  call('apiGetStatus').then(function (st) {
    STATE.status = st;
    STATE.docTypes = st.docTypes || [];
    STATE.issuers = st.issuers || [];
    STATE.issuerLevels = st.issuerLevels || [];
    $('#userBox').innerHTML = 'Đăng nhập: <b>' + esc(st.userEmail || '') + '</b>';
    $('#initBanner').classList.toggle('hidden', st.initialized);
    fillTypeSelects();
    fillLevelSelect();
    renderSysInfo();
    renderStatCardsFromStatus();
    renderOcrQueue();
    loadStats();
    showLoading(false);
    // Tìm kiếm là màn hình mặc định: tự nạp toàn bộ văn bản ngay khi mở app.
    if (st.initialized && !STATE.searched) doSearch(1, true);
  }).catch(function (err) {
    showLoading(false);
    toast('Lỗi tải trạng thái: ' + (err.message || err), 'err');
  });
}

function doInitialize() {
  showLoading(true, 'Đang khởi tạo folder và cơ sở dữ liệu...');
  call('apiInitialize').then(function (st) {
    STATE.status = st;
    STATE.docTypes = st.docTypes || [];
    STATE.issuers = st.issuers || [];
    STATE.issuerLevels = st.issuerLevels || [];
    $('#initBanner').classList.add('hidden');
    fillTypeSelects();
    fillLevelSelect();
    renderSysInfo();
    showLoading(false);
    toast('Đã khởi tạo hệ thống thành công!', 'ok');
    loadUploadHint();
  }).catch(function (err) {
    showLoading(false);
    toast('Lỗi khởi tạo: ' + (err.message || err), 'err');
  });
}

function fillTypeSelects() {
  var opts = '<option value="">— Tất cả loại —</option>';
  STATE.docTypes.forEach(function (t) {
    opts += '<option value="' + esc(t.code) + '">' + esc(t.name) + '</option>';
  });
  $('#sType').innerHTML = opts;
  $('#listType').innerHTML = opts;
}

function fillLevelSelect() {
  var sel = $('#sLevel');
  if (sel) {
    var opts = '<option value="">— Tất cả cấp —</option>';
    (STATE.issuerLevels || []).forEach(function (lv) {
      opts += '<option value="' + esc(lv) + '">' + esc(lv) + '</option>';
    });
    sel.innerHTML = opts;
  }
  // Gợi ý đơn vị cho ô tìm kiếm.
  var dl = $('#issuerListSearch');
  if (dl) {
    dl.innerHTML = (STATE.issuers || []).map(function (it) {
      return '<option value="' + esc(it.name) + '">';
    }).join('');
  }
}

/* ============ Tổng quan ============ */
function renderStatCardsFromStatus() {
  var st = STATE.status || {};
  $('#statCards').innerHTML =
    statCard(st.totalDocs || 0, 'Tổng số văn bản') +
    statCard((st.docTypes || []).length, 'Loại văn bản') +
    statCard(st.autoScan ? 'Bật' : 'Tắt', 'Tự động quét') +
    statCardText(fmtDateTime(st.lastScan), 'Quét gần nhất');
}
function statCard(num, lbl) {
  return '<div class="stat-card"><div class="num">' + esc(num) + '</div><div class="lbl">' + esc(lbl) + '</div></div>';
}
function statCardText(text, lbl) {
  return '<div class="stat-card"><div class="num" style="font-size:15px;padding-top:8px">' + esc(text) + '</div><div class="lbl">' + esc(lbl) + '</div></div>';
}

function loadStats() {
  call('apiGetStats').then(function (s) {
    if (!s) return;
    renderBarList('#typeChart', (s.byType || []).map(function (t) { return { label: t.name, count: t.count }; }));
    renderBarList('#yearChart', (s.byYear || []).map(function (y) { return { label: y.year, count: y.count }; }));
    renderBarList('#levelChart', (s.byLevel || []).map(function (l) { return { label: l.level, count: l.count }; }));
  }).catch(function () {});
}
function renderBarList(sel, items) {
  var box = $(sel);
  if (!items || !items.length) { box.innerHTML = '<div class="empty">Chưa có dữ liệu</div>'; return; }
  var max = Math.max.apply(null, items.map(function (i) { return i.count; })) || 1;
  box.innerHTML = items.map(function (i) {
    var pct = Math.round(i.count / max * 100);
    return '<div class="bar-row"><div class="bar-label"><span>' + esc(i.label) + '</span><b>' + i.count + '</b></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
  }).join('');
}

/* ============ Danh sách ============ */
function loadList(page) {
  if (!STATE.status || !STATE.status.initialized) { $('#listResults').innerHTML = notInit(); return; }
  STATE.listPage = page || 1;
  var q = {
    keyword: $('#listKeyword').value.trim(),
    typeCode: $('#listType').value,
    sortBy: 'issuedDate', sortDir: 'desc',
    page: page || 1, pageSize: 15
  };
  showLoading(true, 'Đang tải danh sách...');
  call('apiSearch', q).then(function (res) {
    renderResults('#listResults', res, q.keyword);
    renderPager('#listPager', res, loadList);
    showLoading(false);
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}

/* ============ Tìm kiếm ============ */
function doSearch(page, silent) {
  if (!STATE.status || !STATE.status.initialized) { $('#searchResults').innerHTML = notInit(); return; }
  STATE.searchPage = page || 1;
  STATE.searched = true;
  var sort = ($('#sSort').value || 'issuedDate|desc').split('|');
  var q = {
    keyword: $('#sKeyword').value.trim(),
    typeCode: $('#sType').value,
    issuerLevel: $('#sLevel').value,
    issuer: $('#sIssuer') ? $('#sIssuer').value.trim() : '',
    docNumber: $('#sNumber') ? $('#sNumber').value.trim() : '',
    fromDate: $('#sFrom').value,
    toDate: $('#sTo').value,
    sortBy: sort[0], sortDir: sort[1],
    page: page || 1, pageSize: 15
  };
  if (!silent) showLoading(true, 'Đang tìm kiếm...');
  call('apiSearch', q).then(function (res) {
    renderResults('#searchResults', res, q.keyword);
    renderPager('#searchPager', res, doSearch);
    var sum = $('#searchSummary');
    if (sum) sum.textContent = 'Tìm thấy ' + (res.total || 0) + ' văn bản.';
    showLoading(false);
    if (res.total === 0 && !silent) toast('Không tìm thấy văn bản phù hợp.');
  }).catch(function (err) { showLoading(false); if (!silent) toast('Lỗi: ' + (err.message || err), 'err'); });
}

function clearSearch() {
  ['sKeyword', 'sIssuer', 'sNumber', 'sFrom', 'sTo'].forEach(function (id) {
    var e = document.getElementById(id); if (e) e.value = '';
  });
  if ($('#sType')) $('#sType').value = '';
  if ($('#sLevel')) $('#sLevel').value = '';
  if ($('#sSort')) $('#sSort').value = 'issuedDate|desc';
  doSearch(1);
}

// Làm mới kết quả đang xem (sau khi sửa/OCR) mà không cần refresh trang.
function refreshResults() {
  var activeEl = document.querySelector('.tab.active');
  var active = activeEl ? activeEl.dataset.tab : '';
  if (active === 'search' || STATE.searched) doSearch(STATE.searchPage || 1, true);
  if (active === 'list') loadList(STATE.listPage || 1);
}

function notInit() {
  return '<div class="empty">Hệ thống chưa được khởi tạo. Vào tab bất kỳ và nhấn "Khởi tạo hệ thống".</div>';
}

function renderResults(sel, res, keyword) {
  var box = $(sel);
  if (!res) { res = { items: [], total: 0, page: 1, totalPages: 1 }; }
  if (!res.items || !res.items.length) {
    box.innerHTML = '<div class="empty">Không có văn bản nào.<br><span class="muted">Hãy tải văn bản lên folder Drive rồi vào tab "Quét &amp; Cập nhật".</span></div>';
    return;
  }
  box.innerHTML = '';
  var terms = (keyword || '').toLowerCase().split(/\s+/).filter(Boolean);
  res.items.forEach(function (d) {
    var item = el('div', 'doc-item');
    var badge = el('div', 'doc-badge', esc(d.docTypeCode || '?'));
    var main = el('div', 'doc-main');
    main.innerHTML =
      '<div class="doc-title">' + esc(d.title || d.fileName) + '</div>' +
      '<div class="doc-meta">' +
        '<span><b>' + esc(d.docType || 'Khác') + '</b></span>' +
        (d.docNumber ? '<span>Số: <b>' + esc(d.docNumber) + '</b></span>' : '') +
        '<span>Ngày BH: <b>' + fmtDate(d.issuedDate) + '</b></span>' +
        (d.issuer ? '<span>ĐV: <b>' + esc(d.issuer) + '</b>' + (d.issuerLevel ? ' <span class="tag">' + esc(d.issuerLevel) + '</span>' : '') + '</span>' : (d.issuerLevel ? '<span class="tag">' + esc(d.issuerLevel) + '</span>' : '')) +
        '<span>' + esc(d.fileName) + '</span>' +
        '<span class="tag ' + esc(d.ocrStatus) + '">' + ocrLabel(d.ocrStatus) + '</span>' +
      '</div>' +
      (d.snippet ? '<div class="doc-snippet">' + highlight(esc(d.snippet), terms) + '</div>' : '');
    var actions = el('div', 'doc-actions');
    var btnView = el('button', 'btn', 'Xem');
    btnView.addEventListener('click', function () { openDetail(d.fileId); });
    var btnOpen = el('a', 'btn', 'Mở file');
    btnOpen.href = d.fileUrl; btnOpen.target = '_blank';
    actions.appendChild(btnView);
    actions.appendChild(btnOpen);
    item.appendChild(badge); item.appendChild(main); item.appendChild(actions);
    box.appendChild(item);
  });
}
function ocrLabel(s) {
  if (s === 'ok') return 'Đã trích xuất';
  if (s === 'ok-vision') return 'OCR nâng cao (Vision)';
  if (s === 'manual') return 'Đã sửa tay';
  if (s === 'pending') return 'Đang chờ OCR';
  if (s === 'partial') return 'Đang OCR dở';
  if (s === 'skip') return 'Không OCR';
  if (s === 'skip-large') return 'File quá lớn - bỏ OCR';
  if (s === 'error') return 'Lỗi OCR';
  return s || '';
}
function highlight(text, terms) {
  if (!terms || !terms.length) return text;
  terms.forEach(function (t) {
    if (t.length < 2) return;
    try {
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      text = text.replace(re, '<mark>$1</mark>');
    } catch (e) {}
  });
  return text;
}

function renderPager(sel, res, fn) {
  var box = $(sel);
  box.innerHTML = '';
  if (!res) return;
  if (res.totalPages <= 1) {
    if (res.total) box.innerHTML = '<span class="muted">Tổng ' + res.total + ' văn bản</span>';
    return;
  }
  var info = el('span', 'muted', 'Tổng ' + res.total + ' VB — Trang ' + res.page + '/' + res.totalPages + '&nbsp;&nbsp;');
  box.appendChild(info);
  var start = Math.max(1, res.page - 2);
  var end = Math.min(res.totalPages, start + 4);
  if (res.page > 1) addPage(box, '‹', res.page - 1, fn, false);
  for (var p = start; p <= end; p++) addPage(box, p, p, fn, p === res.page);
  if (res.page < res.totalPages) addPage(box, '›', res.page + 1, fn, false);
}
function addPage(box, label, page, fn, active) {
  var b = el('button', active ? 'active' : '', String(label));
  b.addEventListener('click', function () { fn(page); });
  box.appendChild(b);
}

/* ============ Chi tiết ============ */
// Iframe xem bản gốc (PDF/ảnh) của Google Drive. cls: class CSS bổ sung.
function previewIframe_(d, cls) {
  var mt = d.mimeType || '';
  var isPdf = mt === 'application/pdf';
  var isImg = mt.indexOf('image/') === 0;
  if (!isPdf && !isImg) return '';
  var url = 'https://drive.google.com/file/d/' + encodeURIComponent(d.fileId) + '/preview';
  return '<iframe class="doc-preview ' + (cls || '') + '" src="' + url + '"></iframe>';
}
function previewBlock_(d) {
  var f = previewIframe_(d);
  return f ? ('<h3 style="margin-top:16px">Bản gốc (PDF/ảnh)</h3>' + f) : '';
}
function setModalWide_(on) {
  var box = document.querySelector('#modal .modal-box');
  if (box) box.classList.toggle('wide', !!on);
}

function openDetail(fileId) {
  showLoading(true, 'Đang tải chi tiết...');
  call('apiGetDetail', fileId).then(function (d) {
    showLoading(false);
    if (!d) { toast('Không tìm thấy văn bản.', 'err'); return; }
    var html =
      '<h2>' + esc(d.title || d.fileName) + '</h2>' +
      '<div class="sys-info">' +
        row('Loại VB', esc(d.docType) + ' (' + esc(d.docTypeCode) + ')') +
        row('Số/Ký hiệu', esc(d.docNumber || '—')) +
        row('Đơn vị ban hành', esc(d.issuer || '—')) +
        row('Cấp ban hành', esc(d.issuerLevel || '—')) +
        row('Ngày ban hành', fmtDate(d.issuedDate)) +
        row('Tên file', esc(d.fileName)) +
        row('Đường dẫn', esc(d.folderPath || '/')) +
        row('Trạng thái OCR', ocrLabel(d.ocrStatus) + (d.ocrProgress ? ' (' + esc(d.ocrProgress) + ' trang)' : '')) +
        row('Quét lúc', fmtDateTime(d.scannedAt)) +
      '</div>' +
      '<div class="form-row" style="margin-top:14px">' +
        '<a class="btn btn-primary" href="' + esc(d.fileUrl) + '" target="_blank">Mở trên Drive</a>' +
        '<button class="btn" id="btnEditDoc">✎ Sửa thông tin</button>' +
        '<button class="btn" id="btnReOcr">OCR lại</button>' +
      '</div>' +
      previewBlock_(d) +
      '<h3 style="margin-top:16px">Nội dung trích xuất' + (d.ocrProgress ? ' <span class="muted" style="font-weight:normal">(đã OCR ' + esc(d.ocrProgress) + ' trang)</span>' : '') + '</h3>' +
      '<div class="detail-content">' + (d.content ? esc(d.content) : '<i>Chưa có nội dung OCR. Xem bản gốc phía trên; nội dung sẽ có sau khi hàng đợi OCR xử lý, hoặc bấm "OCR lại" / "Sửa thông tin".</i>') + '</div>';
    $('#modalContent').innerHTML = html;
    setModalWide_(false);
    $('#modal').classList.remove('hidden');
    var btn = $('#btnReOcr');
    if (btn) btn.addEventListener('click', function () { doReOcr(d.fileId); });
    var btnE = $('#btnEditDoc');
    if (btnE) btnE.addEventListener('click', function () { openEditForm(d); });
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}

/* ============ Sửa thông tin bằng tay ============ */
function openEditForm(d) {
  var typeOpts = (STATE.docTypes || []).map(function (t) {
    return '<option value="' + esc(t.code) + '"' + (t.code === d.docTypeCode ? ' selected' : '') + '>' + esc(t.name) + '</option>';
  }).join('');
  typeOpts += '<option value="KHAC"' + (d.docTypeCode === 'KHAC' ? ' selected' : '') + '>Khác</option>';

  var levelOpts = '<option value="">— Chưa rõ —</option>' + (STATE.issuerLevels || []).map(function (lv) {
    return '<option value="' + esc(lv) + '"' + (lv === d.issuerLevel ? ' selected' : '') + '>' + esc(lv) + '</option>';
  }).join('');
  var issuerList = (STATE.issuers || []).map(function (it) {
    return '<option value="' + esc(it.name) + '">';
  }).join('');

  var fields =
    '<div class="edit-grid">' +
      '<label>Loại văn bản<select id="edType" class="input">' + typeOpts + '</select></label>' +
      '<label>Số/Ký hiệu<input id="edNumber" class="input" value="' + esc(d.docNumber || '') + '" placeholder="VD: 510/QĐ-ĐHĐL"></label>' +
      '<label>Đơn vị ban hành<input id="edIssuer" class="input" list="issuerList" value="' + esc(d.issuer || '') + '" placeholder="VD: Trường Đại học Điện lực"></label>' +
      '<label>Cấp ban hành<select id="edLevel" class="input">' + levelOpts + '</select></label>' +
      '<label>Ngày ban hành<input id="edDate" type="date" class="input" value="' + esc((d.issuedDate || '').substring(0,10)) + '"></label>' +
      '<label class="full">Trích yếu / Tiêu đề<input id="edTitle" class="input" value="' + esc(d.title || '') + '"></label>' +
      '<label class="full">Nội dung (sửa nếu OCR sai/thiếu)<textarea id="edContent" class="input" rows="8">' + esc(d.content || '') + '</textarea></label>' +
    '</div>' +
    '<div class="form-row" style="margin-top:14px">' +
      '<button class="btn btn-primary" id="btnSaveEdit">Lưu thay đổi</button>' +
      '<button class="btn" id="btnCancelEdit">Huỷ</button>' +
    '</div>' +
    '<p class="muted" style="margin-top:8px">Sau khi lưu, văn bản được đánh dấu <b>"Đã sửa tay"</b> và sẽ <b>không bị ghi đè</b> khi quét lại. Muốn OCR lại đè lên, mở chi tiết và bấm "OCR lại".</p>';

  var preview = previewIframe_(d, 'edit-frame');
  var body;
  if (preview) {
    body =
      '<div class="edit-layout">' +
        '<div class="edit-preview"><div class="muted" style="margin-bottom:6px">Bản gốc — đọc để đối chiếu khi nhập</div>' + preview + '</div>' +
        '<div class="edit-fields">' + fields + '</div>' +
      '</div>';
  } else {
    body = fields;
  }

  var html =
    '<h2>Sửa thông tin văn bản</h2>' +
    '<p class="muted">Tên file: ' + esc(d.fileName) + '</p>' +
    '<datalist id="issuerList">' + issuerList + '</datalist>' +
    body;
  $('#modalContent').innerHTML = html;
  setModalWide_(!!preview);
  $('#modal').classList.remove('hidden');
  $('#btnCancelEdit').addEventListener('click', function () { openDetail(d.fileId); });
  $('#btnSaveEdit').addEventListener('click', function () { saveEdit(d.fileId); });
  // Chọn đơn vị có sẵn -> tự điền cấp ban hành tương ứng.
  $('#edIssuer').addEventListener('change', function () {
    var name = this.value.trim();
    var match = (STATE.issuers || []).filter(function (it) { return it.name === name; })[0];
    if (match && match.level) $('#edLevel').value = match.level;
  });
}

function saveEdit(fileId) {
  var payload = {
    fileId: fileId,
    docTypeCode: $('#edType').value,
    docNumber: $('#edNumber').value.trim(),
    issuer: $('#edIssuer').value.trim(),
    issuerLevel: $('#edLevel').value,
    issuedDate: $('#edDate').value,
    title: $('#edTitle').value.trim(),
    content: $('#edContent').value
  };
  showLoading(true, 'Đang lưu...');
  call('apiUpdateDoc', payload).then(function () {
    showLoading(false);
    toast('Đã lưu thay đổi.', 'ok');
    openDetail(fileId);
    // làm mới danh sách/kết quả/thống kê ngay, không cần refresh trang
    refreshResults();
    loadStats();
  }).catch(function (err) { showLoading(false); toast('Lỗi lưu: ' + (err.message || err), 'err'); });
}
function row(k, v) { return '<div class="k">' + k + '</div><div>' + v + '</div>'; }
function closeModal() { $('#modal').classList.add('hidden'); setModalWide_(false); }

function doReOcr(fileId) {
  showLoading(true, 'Đang OCR lại (có thể mất chút thời gian)...');
  call('apiReOcr', fileId).then(function () {
    showLoading(false);
    toast('Đã OCR lại thành công.', 'ok');
    openDetail(fileId);
    refreshResults();
    loadStats();
  }).catch(function (err) { showLoading(false); toast('Lỗi OCR: ' + (err.message || err), 'err'); });
}

/* ============ Quét ============ */
function loadUploadHint() {
  if (!STATE.status || !STATE.status.initialized) {
    $('#uploadHint').innerHTML = 'Hãy khởi tạo hệ thống trước (banner phía trên).';
    return;
  }
  call('apiGetUploadInfo').then(function (info) {
    $('#uploadHint').innerHTML =
      '📁 Tải văn bản (PDF, ảnh scan, Word, Google Docs) vào folder gốc: ' +
      '<a href="' + esc(info.folderUrl) + '" target="_blank"><b>' + esc(info.folderName) + '</b></a> ' +
      'rồi nhấn <b>Quét ngay</b>.';
  }).catch(function () {});
}

function doScan(force) {
  if (!STATE.status || !STATE.status.initialized) { toast('Hãy khởi tạo hệ thống trước.', 'err'); return; }
  showLoading(true, force ? 'Đang quét lại toàn bộ & OCR...' : 'Đang quét Drive...');
  call('apiScan', force).then(function (s) {
    showLoading(false);
    $('#scanResult').innerHTML =
      '<div class="muted" style="margin-bottom:6px">Kết quả quét:</div>' +
      scanStat('Đã xử lý', s.scanned) +
      scanStat('Thêm mới', s.inserted) +
      scanStat('Cập nhật', s.updated) +
      scanStat('Xếp hàng đợi OCR', s.queued) +
      scanStat('Bỏ qua', s.skipped) +
      scanStat('Đã xoá', s.deleted) +
      scanStat('Lỗi', s.errors) +
      (s.limitHit ? '<div class="upload-hint" style="margin-top:10px">Còn văn bản chưa xử lý (giới hạn mỗi lượt). Nhấn <b>Quét ngay</b> lần nữa để tiếp tục.</div>' : '');
    toast('Quét xong: +' + s.inserted + ' mới, ' + s.updated + ' cập nhật, ' + s.queued + ' chờ OCR.', 'ok');
    loadStatus();
    renderOcrQueue();
  }).catch(function (err) { showLoading(false); toast('Lỗi quét: ' + (err.message || err), 'err'); });
}
function scanStat(lbl, num) {
  return '<span class="scan-stat">' + esc(lbl) + ': <b>' + (num || 0) + '</b></span>';
}

function setAutoScan(enable) {
  var hours = parseInt($('#autoHours').value, 10);
  showLoading(true, 'Đang cập nhật lịch quét...');
  // apiSetAutoScan nhận 2 tham số nên gọi trực tiếp google.script.run.
  google.script.run
    .withSuccessHandler(function (r) {
      showLoading(false);
      toast(r.message, 'ok');
      $('#autoStatus').innerHTML = r.autoScan ? 'Trạng thái: <b>Đang bật</b>' : 'Trạng thái: <b>Đã tắt</b>';
      loadStatus();
    })
    .withFailureHandler(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); })
    .apiSetAutoScan(enable, hours);
}

/* ============ Hàng đợi OCR ============ */
function renderOcrQueue() {
  var st = STATE.status || {};
  var box = $('#ocrQueueStatus');
  if (!box) return;
  var engine = st.visionEnabled ? 'Vision (giới hạn theo trang/ngày)' : 'Drive OCR (miễn phí, chất lượng cơ bản)';
  box.innerHTML =
    'Đang chờ OCR: <b>' + (st.ocrPending || 0) + '</b> văn bản &nbsp;•&nbsp; ' +
    'Động cơ: <b>' + engine + '</b><br>' +
    'Đã dùng hôm nay: <b>' + (st.ocrUsedToday || 0) + '</b> / ' + (st.ocrDailyLimit || 0) + ' trang (Vision) &nbsp;•&nbsp; ' +
    'Tự động OCR: ' + (st.ocrAuto ? '<span class="tag ok">Đang bật</span>' : '<span class="tag skip">Tắt</span>');
  if ($('#ocrLimit')) $('#ocrLimit').value = st.ocrDailyLimit || 0;
}

function doOcrRun() {
  if (!STATE.status || !STATE.status.initialized) { toast('Hãy khởi tạo hệ thống trước.', 'err'); return; }
  showLoading(true, 'Đang OCR hàng đợi...');
  call('apiOcrQueueRun').then(function (s) {
    showLoading(false);
    $('#ocrRunResult').innerHTML =
      '<div class="muted" style="margin-bottom:6px">Kết quả OCR lượt này:</div>' +
      scanStat('Đã xử lý', s.processed) +
      scanStat('Hoàn tất', s.completed) +
      scanStat('Còn dở (nhiều trang)', s.partial) +
      scanStat('Trang Vision đã dùng', s.pagesUsed) +
      scanStat('File quá lớn', s.skippedLarge) +
      scanStat('Lỗi', s.errors) +
      scanStat('Còn chờ', s.pending) +
      (s.usedVision && s.budgetLeft <= 0 ? '<div class="upload-hint" style="margin-top:10px">Đã đạt hạn mức trang/ngày. Hệ thống sẽ OCR tiếp vào ngày mai, hoặc tăng giới hạn nếu bạn có hạn mức Vision cao hơn.</div>' : '') +
      (s.pending > 0 ? '<div class="upload-hint" style="margin-top:10px">Còn <b>' + s.pending + '</b> văn bản trong hàng đợi. Bấm lại "OCR hàng đợi ngay" hoặc bật tự động OCR để xử lý dần.</div>' : '');
    toast('OCR xong lượt này: hoàn tất ' + s.completed + ', còn chờ ' + s.pending + '.', 'ok');
    loadStatus();
  }).catch(function (err) { showLoading(false); toast('Lỗi OCR: ' + (err.message || err), 'err'); });
}

function saveOcrLimit() {
  var n = parseInt($('#ocrLimit').value, 10);
  showLoading(true, 'Đang lưu giới hạn...');
  call('apiSetOcrLimit', n).then(function (r) {
    showLoading(false);
    if (STATE.status) STATE.status.ocrDailyLimit = r.dailyLimit;
    renderOcrQueue();
    toast('Đã đặt giới hạn ' + r.dailyLimit + ' trang/ngày.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}

function setOcrAuto(enable) {
  var hours = parseInt($('#ocrHours').value, 10);
  showLoading(true, 'Đang cập nhật lịch OCR...');
  google.script.run
    .withSuccessHandler(function (r) {
      showLoading(false);
      toast(r.message, 'ok');
      loadStatus();
      setTimeout(renderOcrQueue, 300);
    })
    .withFailureHandler(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); })
    .apiSetOcrAuto(enable, hours);
}

/* ============ Cài đặt ============ */
function renderSysInfo() {
  var st = STATE.status || {};
  var box = $('#sysInfo');
  var rootHtml = st.rootFolder ? '<a href="' + esc(st.rootFolder.url) + '" target="_blank">' + esc(st.rootFolder.name) + '</a>' : '<i>Chưa tạo</i>';
  var dbHtml = st.database ? '<a href="' + esc(st.database.url) + '" target="_blank">' + esc(st.database.name) + '</a>' : '<i>Chưa tạo</i>';
  box.innerHTML =
    row('Tài khoản', esc(st.userEmail || '')) +
    row('Trạng thái', st.initialized ? '<span class="tag ok">Đã khởi tạo</span>' : '<span class="tag error">Chưa khởi tạo</span>') +
    row('Folder gốc', rootHtml) +
    row('Cơ sở dữ liệu', dbHtml) +
    row('Tổng văn bản', esc(st.totalDocs || 0)) +
    row('Tự động quét', st.autoScan ? '<span class="tag ok">Đang bật</span>' : '<span class="tag skip">Tắt</span>') +
    row('Động cơ OCR', st.visionEnabled ? '<span class="tag ok">Vision (nâng cao)</span>' : '<span class="tag skip">Drive OCR (cơ bản)</span>') +
    row('Quét gần nhất', fmtDateTime(st.lastScan));
}

function renderTypesTable() {
  var t = $('#typesTable');
  t.innerHTML =
    '<tr><th style="width:70px">Mã</th><th style="width:180px">Tên loại</th><th>Từ khoá (phân loại tự động)</th><th style="width:60px">Xoá</th></tr>';
  (STATE.docTypes || []).forEach(function (dt, idx) {
    addTypeRowEl(t, dt, idx);
  });
}
function addTypeRowEl(table, dt, idx) {
  var tr = el('tr');
  tr.innerHTML =
    '<td><input value="' + esc(dt.code || '') + '" data-f="code"></td>' +
    '<td><input value="' + esc(dt.name || '') + '" data-f="name"></td>' +
    '<td><input value="' + esc((dt.keywords || []).join(', ')) + '" data-f="keywords"></td>' +
    '<td style="text-align:center"><button class="btn" data-del="1">×</button></td>';
  tr.querySelector('[data-del]').addEventListener('click', function () { tr.remove(); });
  table.appendChild(tr);
}
function addTypeRow() {
  addTypeRowEl($('#typesTable'), { code: '', name: '', keywords: [] }, -1);
}
function collectTypes() {
  var rows = $all('#typesTable tr');
  var out = [];
  rows.forEach(function (tr, i) {
    if (i === 0) return; // header
    var code = tr.querySelector('[data-f="code"]').value.trim();
    var name = tr.querySelector('[data-f="name"]').value.trim();
    var kw = tr.querySelector('[data-f="keywords"]').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (code && name) out.push({ code: code, name: name, priority: i, keywords: kw });
  });
  return out;
}
function saveTypes() {
  var types = collectTypes();
  if (!types.length) { toast('Cần ít nhất 1 loại văn bản.', 'err'); return; }
  showLoading(true, 'Đang lưu...');
  call('apiSaveDocTypes', types).then(function (dt) {
    STATE.docTypes = dt;
    fillTypeSelects();
    showLoading(false);
    toast('Đã lưu danh sách loại văn bản.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
function resetTypes() {
  showLoading(true, 'Đang khôi phục...');
  call('apiResetDocTypes').then(function (dt) {
    STATE.docTypes = dt;
    fillTypeSelects();
    renderTypesTable();
    showLoading(false);
    toast('Đã khôi phục danh sách mặc định.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}

/* ============ Đơn vị ban hành ============ */
function renderIssuersTable() {
  var t = $('#issuersTable');
  if (!t) return;
  var levelOptsHtml = function (sel) {
    return (STATE.issuerLevels || []).map(function (lv) {
      return '<option value="' + esc(lv) + '"' + (lv === sel ? ' selected' : '') + '>' + esc(lv) + '</option>';
    }).join('');
  };
  t.innerHTML =
    '<tr><th style="width:200px">Tên đơn vị</th><th style="width:130px">Cấp</th><th>Từ khoá (nhận diện tự động)</th><th style="width:60px">Xoá</th></tr>';
  (STATE.issuers || []).forEach(function (it) {
    var tr = el('tr');
    tr.innerHTML =
      '<td><input value="' + esc(it.name || '') + '" data-f="name"></td>' +
      '<td><select data-f="level" style="width:100%;border:none">' + levelOptsHtml(it.level) + '</select></td>' +
      '<td><input value="' + esc((it.keywords || []).join(', ')) + '" data-f="keywords"></td>' +
      '<td style="text-align:center"><button class="btn" data-del="1">×</button></td>';
    tr.querySelector('[data-del]').addEventListener('click', function () { tr.remove(); });
    t.appendChild(tr);
  });
}
function addIssuerRow() {
  var t = $('#issuersTable');
  var levelOpts = (STATE.issuerLevels || []).map(function (lv) {
    return '<option value="' + esc(lv) + '">' + esc(lv) + '</option>';
  }).join('');
  var tr = el('tr');
  tr.innerHTML =
    '<td><input value="" data-f="name"></td>' +
    '<td><select data-f="level" style="width:100%;border:none">' + levelOpts + '</select></td>' +
    '<td><input value="" data-f="keywords"></td>' +
    '<td style="text-align:center"><button class="btn" data-del="1">×</button></td>';
  tr.querySelector('[data-del]').addEventListener('click', function () { tr.remove(); });
  t.appendChild(tr);
}
function collectIssuers() {
  var rows = $all('#issuersTable tr');
  var out = [];
  rows.forEach(function (tr, i) {
    if (i === 0) return;
    var name = tr.querySelector('[data-f="name"]').value.trim();
    var level = tr.querySelector('[data-f="level"]').value;
    var kw = tr.querySelector('[data-f="keywords"]').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (name) out.push({ name: name, level: level, keywords: kw });
  });
  return out;
}
function saveIssuers() {
  var issuers = collectIssuers();
  if (!issuers.length) { toast('Cần ít nhất 1 đơn vị.', 'err'); return; }
  showLoading(true, 'Đang lưu...');
  call('apiSaveIssuers', issuers).then(function (list) {
    STATE.issuers = list;
    showLoading(false);
    toast('Đã lưu danh mục đơn vị ban hành.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
function resetIssuers() {
  showLoading(true, 'Đang khôi phục...');
  call('apiResetIssuers').then(function (list) {
    STATE.issuers = list;
    renderIssuersTable();
    showLoading(false);
    toast('Đã khôi phục danh mục mặc định.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}

/* ============ OCR nâng cao (Vision) ============ */
function renderVisionStatus() {
  var st = STATE.status || {};
  var box = $('#visionStatus');
  if (!box) return;
  if (st.visionEnabled) {
    box.innerHTML = 'Động cơ OCR hiện tại: <b>Google Cloud Vision (nâng cao)</b> <span class="tag ok">Đang bật</span>';
  } else {
    box.innerHTML = 'Động cơ OCR hiện tại: <b>Drive OCR (cơ bản)</b> <span class="tag skip">Chưa bật Vision</span>';
  }
}
function saveVision() {
  var key = $('#visionKey').value.trim();
  if (!key) { toast('Hãy dán API key trước.', 'err'); return; }
  showLoading(true, 'Đang lưu API key...');
  call('apiSetVisionKey', key).then(function (r) {
    showLoading(false);
    if (STATE.status) STATE.status.visionEnabled = r.visionEnabled;
    $('#visionKey').value = '';
    renderVisionStatus();
    renderSysInfo();
    toast('Đã lưu API key. Bấm "Kiểm tra" để xác nhận, rồi "Quét lại toàn bộ" để OCR lại.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
function testVision() {
  showLoading(true, 'Đang kiểm tra API key...');
  call('apiTestVision').then(function (r) {
    showLoading(false);
    toast(r.message, r.ok ? 'ok' : 'err');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
function clearVision() {
  showLoading(true, 'Đang xoá API key...');
  call('apiSetVisionKey', '').then(function (r) {
    showLoading(false);
    if (STATE.status) STATE.status.visionEnabled = r.visionEnabled;
    renderVisionStatus();
    renderSysInfo();
    toast('Đã xoá API key. Quay lại dùng Drive OCR.', 'ok');
  }).catch(function (err) { showLoading(false); toast('Lỗi: ' + (err.message || err), 'err'); });
}
</script>
